    <rect x="20" y="20" width="8" height="24" rx="4" fill="#00F5D4" filter="url(#neonGlow)"/>
    <text x="36" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">ENGINEERING SPECS</text>

